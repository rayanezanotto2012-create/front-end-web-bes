<!DOCTYPE html>
<html lang="pt-br">
    <head>
      <title>Recrutamento online</title>
      <meta charset="UTF-8">
    </head>
    <body>
      <header>
        <h1>Recrutamento online</h1>
      </header>
      <main>
        <section>
            <h2>Cadastre o seu currículo</h2>
            <form action="#" method="post">
                <p>Preencha o formulário para se candidatar à vaga</p>
                <fieldset>
                 <legend>Dados Pessoais</legend>
                 <div>
                 <label for="nome_id">Nome completo:</label>
                 <input id="nome_id" name="nome" type="text">
                 </div>
                 <div>
                 <label for="Telefone_id">Telefone:</label>
                 <input id="Telefone_id" name="telefone" type="tel">
                 </div>
                 <div>
                    <label for="email_id">E-mail:</label>
                    <input id="email_id" name="email" type="email">
                 </div>
                 <div>
                    <label for="data_nasc_id">Data de nascimento:</label>
                    <input id="data_nasc_id" name="data de nascimento" type="date">
                 </div>

                </fieldset>  
                <fieldset>
                <legend>Endereço</legend>

                <div>
                 <label for="logradouro_id">Logradouro:</label> 
                 <input id="logradouro_id" name="logradouro" type="text">

                </div>

                <div>
                    <label for="cidade_id">Cidade:</label>
                    <input id="cidade_id" name="cidade" type="text">
                </div>

                <div>
                    <label for="estado_id">Estado:</label>
                    <input id="estado_id" name="estado" type="text">
                </div>

                <div>
                    <label for="cep_id">CEP:</label>
                    <input id="cep_id" name="cep" type="text">
                </div>

                <div>
                    <label for="numero_id">Número:</label>
                    <input id="numero_id" name="numero" type="text">
                </div>
                </fieldset>

                <fieldset>
                <legend>Resumo</legend>
                <div>
                    <label for="resumo_id">Fale sobre você:</label>
                    <textarea id="resumo_id" 
                    name="resumo"
                    rows="4"
                    cols="50"></textarea>
                </div>
                </fieldset>

                <fieldset>
                <legend>Nível desejado</legend>
                <div>
                    <input type="radio" id="estagiario_id" name="nivel" value="estagiario">
                    <label for="estagiario_id">Estagiário</label>
                </div>

                <div>
                    <input type="radio" id="junior_id" name="nivel" value="junior">
                    <label for="junior_id">Júnior</label>
                </div>

                <div>
                    <input type="radio" id="pleno_id" name="nivel" value="pleno">
                    <label for="pleno_id">Pleno</label>
                </div>

                <div>
                    <input type="radio" id="senior_id" name="nivel" value="senior">
                    <label for="senior_id">Sênior</label>
                </div>

                </fieldset>

                <fieldset>
                <legend>Tecnologias que domina</legend>
                <div>
                    <input type="checkbox" id="html_id" name="tecnologias" value="html">
                    <label for="html_id">HTML</label>
                </div>

                <div>
                    <input type="checkbox" id="css_id" name="tecnologias" value="css">
                    <label for="css_id">CSS</label>
                </div>

                <div>
                    <input type="checkbox" id="javascript_id" name="tecnologias" value="javascript">
                    <label for="javascript_id">JavaScript</label>
                </div>

                </fieldset>

                <fieldset>
                    <legend>Grau de inscrição</legend>
                    <div>
                        <label for="grau_id">Selecione o grau de inscrição:</label>
                        <select id="grau_id" name="grau">
                            <option value="fundamental">Fundamental</option>
                            <option value="medio">Médio</option>
                            <option value="graduação">Graduação</option>
                            <option value="pos">Pós-graduação</option>
                        </select>
                    </div>
                </fieldset>

                <div>
                    <button type="reset">Limpar dados</button>
                    <button type="submit">Enviar dados</button> 
                </div>
            </form>
        </section>
      </main>
      <footer>
        <p>Todos os direitos reservados &copy;</p>
      </footer>
    </body>
</html>
